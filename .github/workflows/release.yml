name: Release

on:
  push:
    branches: [main]
  # Publishes a release that already has a tag and a GitHub release but never reached npm,
  # e.g. when a publish step failed or was skipped. Runs the same jobs as a release does.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # The package lives at packages/groundboard, so release-please names its outputs after that path;
      # the bare release_created, version and tag_name are set only for a package at the repository root.
      release_created: ${{ steps.release.outputs['packages/groundboard--release_created'] || steps.existing.outputs.release_created }}
      version: ${{ steps.release.outputs['packages/groundboard--version'] || steps.existing.outputs.version }}
      tag_name: ${{ steps.release.outputs['packages/groundboard--tag_name'] || steps.existing.outputs.tag_name }}
    steps:
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: existing
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          { echo "release_created=true"; echo "tag_name=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"

  # 1. npm first: nothing below may point at a version npm does not have.
  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance; no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/check-pack.mjs
      - name: Publish
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node scripts/pack.mjs --stage "$RUNNER_TEMP/stage" --out "$RUNNER_TEMP/pack"
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "$RUNNER_TEMP/pack/groundboard-$VERSION.tgz" --provenance --access public --tag "$tag"

  # 2. The image, built from the same commit.
  publish-image:
    needs: [release-please, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.release-please.outputs.version, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3. Only after npm has the version: point the plugin at it, through a pull request.
  bump-plugin:
    needs: [release-please, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Open the plugin version pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node scripts/bump-plugin-version.mjs "$VERSION"
          git diff --quiet && { echo "plugin already pins $VERSION"; exit 0; }
          branch="chore/plugin-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(plugin): pin groundboard@$VERSION"
          git push origin "$branch"
          gh pr create --title "chore(plugin): pin groundboard@$VERSION" \
            --body "npm now has groundboard@$VERSION; this points the Claude Code plugin at it."

  # 4. The project site and the hosted editor, from the released tag.
  deploy-pages:
    needs: [release-please, publish-npm]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
