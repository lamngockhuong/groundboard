name: Docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: groundboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run and probe
        run: |
          docker run -d --name gb -p 8787:8787 groundboard:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz && break
            sleep 1
          done
          test "$(docker inspect --format '{{.Config.User}}' groundboard:ci)" != ""
          test "$(docker exec gb /nodejs/bin/node -e 'process.stdout.write(String(process.getuid()))')" != "0"
          jq '{board: .}' examples/order-state-machine.board.json \
            | curl -fsS -H 'content-type: application/json' --data-binary @- http://127.0.0.1:8787/api/render \
            | jq -e '.ok == true and .scene.type == "excalidraw"'
          curl -fsS http://127.0.0.1:8787/ | grep -qi '<html'
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gb)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
      - if: always()
        run: docker logs gb || true
