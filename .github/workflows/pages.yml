name: Pages

# The project site on GitHub Pages: the home page (apps/site) at the root and the hosted editor
# (the viewer built with the sample boards, apps/web `build:hosted`) under /editor/. Called by
# the release workflow once a version is on npm, so the editor matches the released viewer. To
# deploy again by hand, run it from the Actions tab and pick the tag or branch in "Use workflow
# from": it then runs in that ref's own context. It takes no ref as an input, since building one
# from the default branch's context could poison that branch's cache.
on:
  workflow_call:
    inputs:
      ref:
        description: Tag or branch to build
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released tag when called; the ref the run was started from otherwise.
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The viewer with the samples; the workspace packages it imports are read from source.
      - run: pnpm -C apps/web build:hosted
      - name: Put the editor under the home page
        run: |
          mkdir -p _site
          cp -R apps/site/. _site/
          cp -R apps/web/dist-hosted _site/editor
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
