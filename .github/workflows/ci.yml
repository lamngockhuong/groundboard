name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node scripts/check-plugin-version.mjs
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm test
      # The served viewer must reach nothing off the machine; checked in Chromium once per run.
      - if: matrix.node == 24
        run: pnpm -C packages/groundboard exec playwright install --with-deps --only-shell chromium
      - if: matrix.node == 24
        run: pnpm test:browser
      - run: node scripts/check-pack.mjs
